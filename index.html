<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday dear Bestie 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="gate" class="screen">
  <div class="gift">🎁</div>
  <h1 class="script">Ek chhota sa surprise<br>sirf tumhare liye</h1>
  <button id="openBtn" class="btn">Tap to open 🎀</button>
  <p class="hint">Sound on rakhna 🔊</p>
</div>

<button id="snd" class="hide" aria-label="Sound on/off">🔊</button>
<button id="next" class="btn hide">Surprise dekho 🎀</button>

<div id="gallery" class="screen hide">
  <h2 class="script">Tere liye, meri Bestie 💗</h2>
  <div class="stage" id="stage"><div class="ring" id="ring"></div></div>
  <p class="hint">Swipe karo ↔ &nbsp;·&nbsp; tap karke bada karo</p>
</div>

<div id="lb" class="hide"><img id="lbImg" alt="Birthday wish"><b>✕</b></div>

<audio id="wish" src="assets/wish.mp3" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
